<article id="create_selector">
    <fieldset>
	<legend>Select a gender:</legend>
	<div>
	    <input type="radio" name="gender" id="male" checked />
	    <label for="male">Male</label>
	</div>
	<div>
	    <input type="radio" name="gender" id="female" />
	    <label for="female">Female</label>
	</div>
    </fieldset>
<div>
    <selector class="head">
	<l-arrow></l-arrow>
	<img src="./assets/character_images/m_human_head.webp" alt="">
	<r-arrow></r-arrow>
    </selector>
    <selector class="body">
	<l-arrow></l-arrow>
	<img src="./assets/character_images/m_human_body.webp" alt="">
	<r-arrow></r-arrow>
    </selector>
    <selector class="legs">
	<l-arrow></l-arrow>
	<img src="./assets/character_images/m_human_legs.webp" alt="">
	<r-arrow></r-arrow>
    </selector>
    <selector class="feet">
	<l-arrow></l-arrow>
	<img src="./assets/character_images/m_human_feet.webp" alt="">
	<r-arrow></r-arrow>
    </selector>
</div>
    <button id="nextBtn">Next</button>
</article>

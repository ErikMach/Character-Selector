<article id="create_selector">
    <fieldset>
	<legend>Select a maintenance drone:</legend>
	<div>
	    <input type="radio" name="gender" id="male" checked />
	    <label for="male">Male</label>
	</div>
	<div>
	    <input type="radio" name="gender" id="female" />
	    <label for="female">Female</label>
	</div>
    </fieldset>

    <selector class="head">
	<l-arrow></l-arrow>
	<div>
	    <img class="l" src="" alt="">
	    <img class="c" src="" alt="">
	    <img class="r" src="" alt="">
	</div>
	<r-arrow></r-arrow>
    </selector>
    <selector class="body"></selector>
    <selector class="legs"></selector>
    <selector class="feet"></selector>
</article>
